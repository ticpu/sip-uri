name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Lib only: dev-dependencies are free to require a newer toolchain than
    # what we promise published consumers.
    - name: Read rust-version from Cargo.toml
      run: echo "MSRV=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_ENV"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.MSRV }}

    - name: Check
      run: cargo check

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      id: toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl

    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        # Cargo.lock is not tracked on branches, so the manifest and toolchain key the cache.
        key: ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.toml') }}

    - name: Check
      run: cargo check --all-targets

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Docs
      run: RUSTDOCFLAGS="-D missing_docs -D rustdoc::broken_intra_doc_links" cargo doc --no-deps

    - name: Test
      run: cargo test

    - name: Build
      run: cargo build --release --all-targets

    # The static build is how fs-sip-uri actually ships, so break here rather
    # than at deploy time.
    - name: Build fs-sip-uri for musl
      run: |
        cargo build --profile release-min --target x86_64-unknown-linux-musl --example fs-sip-uri
        bin=target/x86_64-unknown-linux-musl/release-min/examples/fs-sip-uri
        file "$bin" | grep -q static
        "$bin" --version
        test "$("$bin" get param.participantid 'sip:sip.example.com;participantid=2')" = 2
        test "$("$bin" get warnings 'sip:sip.example.com:+5060')" = port:signed-port
