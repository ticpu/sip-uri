name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check
      run: cargo check --all-targets

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Docs
      run: RUSTDOCFLAGS="-D missing_docs -D rustdoc::broken_intra_doc_links" cargo doc --no-deps

    - name: Test
      run: |
        set -o pipefail
        CARGO_TERM_COLOR=never cargo test 2>&1 | tee test-output.txt
        passed=$(grep '^test result:' test-output.txt | sed 's/.*ok\. \([0-9]*\) passed.*/\1/' | paste -sd+ | bc)
        echo "TEST_PASSED=$passed" >> "$GITHUB_ENV"

    - name: Build
      run: cargo build --release --all-targets

    # The static build is how fs-sip-uri actually ships, so break here rather
    # than at deploy time.
    - name: Build fs-sip-uri for musl
      run: |
        cargo build --release --target x86_64-unknown-linux-musl --example fs-sip-uri
        bin=target/x86_64-unknown-linux-musl/release/examples/fs-sip-uri
        file "$bin" | grep -q static
        "$bin" --version
        test "$("$bin" get param.participantid 'sip:sip.example.com;participantid=2')" = 2
